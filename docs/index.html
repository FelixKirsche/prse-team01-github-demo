<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRSE Team 01 – Git & GitHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/black.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/monokai.css">
  <style>
    :root { --r-main-font: Inter, Segoe UI, Arial, sans-serif; --r-heading-font: Inter, Segoe UI, Arial, sans-serif; --r-link-color: #5eead4; --r-selection-background-color: #115e59; }
    .reveal h1,.reveal h2 { text-transform:none; letter-spacing:-.035em; }
    .reveal h1 { color:#5eead4; }
    .reveal p,.reveal li { font-size:.8em; }
    .reveal pre { width:100%; font-size:.58em; box-shadow:none; border:1px solid #334155; border-radius:10px; }
    .reveal code { max-height:500px; }
    .reveal small { color:#94a3b8; }
    .reveal blockquote { width:90%; border-left:4px solid #5eead4; padding:15px 25px; background:#172333; }
    .reveal .progress { color:#5eead4; }
  </style>
</head>
<body>
  <div class="reveal"><div class="slides">
    <section data-markdown="slides.md" data-separator="^---$" data-charset="utf-8"></section>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/notes/notes.js"></script>
  <script>Reveal.initialize({ hash:true, controls:true, progress:true, slideNumber:'c/t', transition:'slide', plugins:[RevealMarkdown,RevealHighlight,RevealNotes] });</script>
</body>
</html>
